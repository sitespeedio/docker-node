name: Build the docker containers
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    if: ${{ !contains(github.event.head_commit.message, 'docs:') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build the images
        run: docker buildx bake --load --set "*.platform=${{ matrix.platform }}" --set browsers.tags=sitespeedio/webbrowsers:test

      - name: Check the tools in the browsers image
        run: docker run --rm sitespeedio/webbrowsers:test bash -c 'node --version && ffmpeg -version | head -1 && python --version && google-chrome --version && firefox --version'

      # The browsers image has the layers of all the images
      - name: Run Trivy vulnerability scanner
        if: ${{ matrix.platform == 'linux/amd64' }}
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # master
        with:
          image-ref: 'sitespeedio/webbrowsers:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
