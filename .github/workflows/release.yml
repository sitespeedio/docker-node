name: Release the docker containers
on:
  workflow_dispatch:
    inputs:
      start_at:
        description: 'The first image to build. All images after it are built too.'
        type: choice
        options:
          - node
          - visualmetrics-deps
          - browsers
        default: node
concurrency:
  group: release
permissions:
  contents: read
env:
  START_AT: ${{ inputs.start_at }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      # Get the date one time so that all platforms get the same tag
      - name: Get the date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    env:
      DATE: ${{ needs.prepare.outputs.date }}
      PUSH_BY_DIGEST: true
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to DockerHub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        run: docker buildx bake --provenance=false --set "*.platform=${{ matrix.platform }}" --metadata-file metadata.json "from-$START_AT"

      - name: Upload the digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: metadata-${{ matrix.arch }}
          path: metadata.json

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATE: ${{ needs.prepare.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to DockerHub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download the digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: metadata-*
          path: metadata

      - name: Tag the multi-platform images
        run: |
          echo "## Published images" >> "$GITHUB_STEP_SUMMARY"
          docker buildx bake --print "from-$START_AT" | jq -r '.target | to_entries[] | "\(.key) \(.value.tags[0])"' |
          while read -r target image; do
            repository=${image%:*}
            mapfile -t sources < <(jq -r --arg target "$target" --arg repository "$repository" '"\($repository)@\(.[$target]["containerimage.digest"])"' metadata/*/metadata.json)
            docker buildx imagetools create -t "$image" "${sources[@]}"
            variable="$(echo "$target" | tr 'a-z-' 'A-Z_')_PUBLISHED_TAG"
            sed -i "s|^variable \"$variable\" { default = \".*\" }$|variable \"$variable\" { default = \"${image#*:}\" }|" docker-bake.hcl
            echo "- \`$image\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Save the published tags
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Published images $DATE"
          git push
